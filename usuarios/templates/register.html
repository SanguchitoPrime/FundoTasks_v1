{% extends "base.html" %}

{% block title %}Registro - FundoTasks{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-8 rounded-xl shadow-sm border border-slate-200">
    <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-slate-900">Crear una cuenta 🌾</h1>
        <p class="text-sm text-slate-500 mt-2">Regístrate para gestionar las labores y asistencia</p>
    </div>
    
    <form method="POST" action="{% url 'usuarios:register' %}" class="space-y-4">
        {% csrf_token %}
        
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label for="nombre" class="block text-sm font-medium text-slate-700 mb-1">Nombre</label>
                <input type="text" name="nombre" id="nombre" required 
                       class="block w-full rounded-md border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2 border" 
                       placeholder="Juan">
            </div>
            <div>
                <label for="apellido" class="block text-sm font-medium text-slate-700 mb-1">Apellido</label>
                <input type="text" name="apellido" id="apellido" required 
                       class="block w-full rounded-md border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2 border" 
                       placeholder="Pérez">
            </div>
        </div>

        <div>
            <label for="rut" class="block text-sm font-medium text-slate-700 mb-1">RUT</label>
            <input type="text" name="rut" id="rut" required 
                   class="block w-full rounded-md border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2 border" 
                   placeholder="12345678-9">
        </div>
        
        <div>
            <label for="correo" class="block text-sm font-medium text-slate-700 mb-1">Correo Electrónico</label>
            <input type="email" name="correo" id="correo" required 
                   class="block w-full rounded-md border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2 border" 
                   placeholder="ejemplo@fundo.cl">
        </div>
        
        <div>
            <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
            <input type="password" name="password" id="password" required 
                   class="block w-full rounded-md border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2 border" 
                   placeholder="••••••••">
        </div>
        
        <button type="submit" class="w-full flex justify-center py-2 px-4 mt-6 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-700 transition-colors">
            Registrarse
        </button>
    </form>
    
    <p class="mt-4 text-center text-sm text-slate-600">
        ¿Ya tienes cuenta? 
        <a href="{% url 'usuarios:login' %}" class="text-emerald-600 hover:text-emerald-500 font-medium">Inicia sesión</a>
    </p>
</div>
{% endblock %}
