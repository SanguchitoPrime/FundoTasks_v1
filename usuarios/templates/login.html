{% extends "base.html" %}

{% block title %}Iniciar Sesión - FundoTasks{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-8 rounded-xl shadow-sm border border-slate-200">
    <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-slate-900">Bienvenido de nuevo 👋</h1>
        <p class="text-sm text-slate-500 mt-2">Ingresa tus credenciales para acceder al sistema del fundo</p>
    </div>
    
    <form method="POST" action="{% url 'usuarios:login' %}" class="space-y-5">
        {% csrf_token %}
        <div>
            <label for="correo" class="block text-sm font-medium text-slate-700 mb-1">RUT o Correo Electrónico</label>
            <input type="text" name="correo" id="correo" required 
                   class="block w-full rounded-md border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2 border" 
                   placeholder="12345678-9 o ejemplo@fundo.cl">
        </div>
        
        <div>
            <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
            <input type="password" name="password" id="password" required 
                   class="block w-full rounded-md border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2 border" 
                   placeholder="••••••••">
        </div>
        
        <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition-colors">
            Ingresar
        </button>
    </form>
    
    <p class="mt-6 text-center text-sm text-slate-600">
        ¿No tienes cuenta? 
        <a href="{% url 'usuarios:register' %}" class="text-emerald-600 hover:text-emerald-500 font-medium">Regístrate aquí</a>
    </p>
</div>
{% endblock %}
